[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "popgensim"
version = "0.1.0"
description = "Population genomics and evolutionary fitness simulator"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "typer"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
sim-pop = "popgensim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]